# Deletes leads past the 12-month retention period in the privacy policy.
# Database only; nothing is emailed.
name: Clean up old leads

on:
  schedule:
    # 1st of every month, 03:37 UTC
    - cron: "37 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-leads
  cancel-in-progress: false

jobs:
  cleanup:
    # Pinned so the runner OS changes when we choose, not when GitHub moves
    # ubuntu-latest (to Ubuntu 26 from 2026-10-19)
    runs-on: ubuntu-24.04
    # Secrets live in the Production environment, limited to the main branch
    environment: Production
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Scheduled runs delete; manual runs default to a dry run
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Delete leads past retention
        run: node cleanup.js
